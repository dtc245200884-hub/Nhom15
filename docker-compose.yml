services:
  canteen-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: canteen-ai
    env_file:
      - .env
    environment:
      DATABASE_URL: "sqlite:////data/canteen.db"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - canteen_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  canteen_data:
